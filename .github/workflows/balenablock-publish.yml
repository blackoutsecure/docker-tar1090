name: Balena Build and Publish

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - main
    paths:
      - Dockerfile
      - balena-compose.yml
      - balena.yml
      - .dockerignore
      - root/**
      - .github/workflows/balenablock-publish.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - balena-compose.yml
      - balena.yml
      - .dockerignore
      - root/**
      - .github/workflows/balenablock-publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BALENA_NAMESPACE: ${{ vars.BALENA_NAMESPACE || secrets.BALENA_USERNAME }}
  BALENA_BLOCK_RELEASE: tar1090
  TAR1090_REPO_URL: https://github.com/wiedehopf/tar1090
  TAR1090_REPO_BRANCH: master

jobs:
  balena:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream tar1090 metadata
        id: upstream
        run: |
          set -euo pipefail

          UPSTREAM_REPO_URL="${TAR1090_REPO_URL}.git"
          UPSTREAM_BRANCH="${TAR1090_REPO_BRANCH}"

          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "${TMPDIR}"' EXIT

          git init "${TMPDIR}" >/dev/null
          git -C "${TMPDIR}" remote add origin "${UPSTREAM_REPO_URL}"
          git -C "${TMPDIR}" fetch --depth 1 origin "${UPSTREAM_BRANCH}" >/dev/null

          # Full commit hash (changes with every upstream push)
          UPSTREAM_COMMIT="$(git -C "${TMPDIR}" rev-parse FETCH_HEAD)"
          UPSTREAM_COMMIT_SHORT="$(echo "${UPSTREAM_COMMIT}" | cut -c1-12)"
          BUILD_DATE="$(git -C "${TMPDIR}" log -1 --format=%cI FETCH_HEAD)"
          # Version from file (only changes when upstream maintainer increments it)
          UPSTREAM_VERSION="$(git -C "${TMPDIR}" show FETCH_HEAD:version 2>/dev/null | tr -d '[:space:]' || echo unknown)"

          echo "ℹ Upstream tar1090 version: ${UPSTREAM_VERSION} (from version file)"
          echo "ℹ Upstream tar1090 commit:  ${UPSTREAM_COMMIT_SHORT}"

          {
            echo "upstream_commit=${UPSTREAM_COMMIT}"
            echo "upstream_commit_short=${UPSTREAM_COMMIT_SHORT}"
            echo "build_date=${BUILD_DATE}"
            echo "upstream_version=${UPSTREAM_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Update balena.yml with resolved version
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.upstream_version }}"
          COMMIT="${{ steps.upstream.outputs.upstream_commit_short }}"
          echo "Updating balena.yml version to: ${VERSION} (upstream commit: ${COMMIT})"
          sed -i -E "s/^version: .*/version: ${VERSION}/" balena.yml
          grep "^version:" balena.yml

      - name: Persist balena.yml version
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.upstream_version }}"
          COMMIT="${{ steps.upstream.outputs.upstream_commit_short }}"
          if git diff --quiet -- balena.yml; then
            echo "balena.yml already matches ${VERSION}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add balena.yml
          git commit -m "chore: sync balena block version to ${VERSION} (upstream ${COMMIT})"
          git push

      - name: Prepare Balena source context
        run: |
          set -euo pipefail
          rm -rf .balena-source
          mkdir -p .balena-source
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.balena-source' \
            ./ .balena-source/
          cp .balena-source/balena-compose.yml .balena-source/docker-compose.yml
          echo "Using balena-compose.yml for block deployment"
          grep "^version:" .balena-source/balena.yml

      - name: Publish Balena block release
        if: github.event_name != 'workflow_dispatch'
        id: balena-deploy
        uses: balena-io/deploy-to-balena-action@master
        with:
          balena_token: ${{ secrets.BALENA_API_TOKEN }}
          fleet: ${{ env.BALENA_NAMESPACE }}/${{ env.BALENA_BLOCK_RELEASE }}
          layer_cache: true
          debug: false
          source: ./.balena-source

      - name: Install Balena CLI for manual publish
        if: github.event_name == 'workflow_dispatch'
        run: npm install -g balena-cli

      - name: Publish Balena block release manually
        if: github.event_name == 'workflow_dispatch'
        id: balena-deploy-manual
        env:
          BALENA_TOKEN: ${{ secrets.BALENA_API_TOKEN }}
        run: |
          set -euo pipefail
          balena login --token "${BALENA_TOKEN}"
          balena push "${BALENA_NAMESPACE}/${BALENA_BLOCK_RELEASE}" \
            --source ./.balena-source \
            --release-tag balena-ci-commit-sha "${GITHUB_SHA}" \
            --release-tag upstream-version "${{ steps.upstream.outputs.upstream_version }}" \
            --release-tag upstream-commit "${{ steps.upstream.outputs.upstream_commit_short }}"
          RELEASE_ID=$(balena release list "${BALENA_NAMESPACE}/${BALENA_BLOCK_RELEASE}" --json | jq -r '.[0].id')
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Log deployment info
        run: |
          echo "Published block release slug: ${{ env.BALENA_NAMESPACE }}/${{ env.BALENA_BLOCK_RELEASE }}"
          echo "Upstream tar1090 version: ${{ steps.upstream.outputs.upstream_version }} (from version file)"
          echo "Upstream tar1090 commit:  ${{ steps.upstream.outputs.upstream_commit_short }}"
          echo "Build date: ${{ steps.upstream.outputs.build_date }}"
