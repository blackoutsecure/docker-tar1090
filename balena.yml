name: tar1090
description: >-
  LinuxServer.io style containerized build of tar1090, a web UI for visualizing
  ADS-B aircraft data from readsb or dump1090 compatible JSON outputs.

post-provisioning: >-
  ## Usage instructions

  Include this snippet in your docker-compose.yml file under 'services':

    ```
    tar1090:
      image: blackoutsecure/tar1090:latest
      restart: unless-stopped
      environment:
        - TZ=Etc/UTC
        - TAR1090_SOURCE_DIR=/data/readsb
      ports:
        - '8080:8080'
      volumes:
        - '/path/to/tar1090/config:/config'
        - '/path/to/readsb/json:/data/readsb:ro'
    ```

  Repository: https://github.com/blackoutsecure/docker-tar1090
  Upstream application: https://github.com/wiedehopf/tar1090

